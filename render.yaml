# Render Blueprint: deploys the CEMS API for free as a Docker web service.
# The database is an external MySQL-compatible server (TiDB Cloud Starter) and the
# web app is hosted on Vercel (frontend/vercel.json). See docs/deployment.md.
#
# Variables marked `sync: false` are asked for in the Render dashboard when the
# Blueprint is created, so no secrets live in this file.

services:
  - type: web
    name: cems-api
    runtime: docker
    plan: free
    # Same region as the TiDB cluster (ap-southeast-1): every request makes several
    # database round trips, so a nearby database matters more than a nearby API.
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    # Free instances have no pre-deploy step, so migrations run on every start.
    # `migrate deploy` only applies pending migrations, so repeating it is harmless.
    # (A plain npm script: Render passes this command through without a shell, so `&&` would fail.)
    dockerCommand: npm run start:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # mysql://USER:PASSWORD@HOST:4000/cems_db?sslaccept=strict
        sync: false
      - key: MIGRATION_DATABASE_URL # same value as DATABASE_URL on the free database
        sync: false
      - key: CLIENT_URL # the Vercel address, e.g. https://cems.vercel.app (no trailing slash)
        sync: false
      # TiDB does not support MySQL advisory locks, which Prisma migrate uses by default.
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: '1'
      # --- M-Pesa: Safaricom Daraja sandbox (test money, no real phone prompt) ---
      - key: MPESA_MODE
        value: sandbox
      - key: MPESA_SHORTCODE
        value: '174379' # Safaricom's public sandbox paybill
      - key: MPESA_CONSUMER_KEY # from your app on developer.safaricom.co.ke
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY # the sandbox passkey on the Daraja "M-Pesa Express" simulator page
        sync: false
      - key: MPESA_CALLBACK_BASE_URL # this API's own public address, no trailing slash
        sync: false
      - key: MPESA_CALLBACK_TOKEN # random secret, 16+ characters; part of the callback URL
        sync: false
      # --- Email: Mailtrap sandbox over port 2525 (Render's free tier blocks 25/465/587) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '2525'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: CEMS <no-reply@cems.test>

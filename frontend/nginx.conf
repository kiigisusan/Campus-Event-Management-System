server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The browser talks only to this server; /api is forwarded to the backend
  # container. One origin means no CORS problems and one URL to share.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Single-page app: unknown paths (e.g. /events/3) fall back to index.html.
  location / {
    try_files $uri /index.html;
  }

  # Hashed build files never change, so browsers can cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
